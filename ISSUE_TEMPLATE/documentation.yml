name: Documentation improvement
description: Propose new or improved platform guidance
title: "[Docs]: "
labels:
  - documentation
body:
  - type: input
    id: subject
    attributes:
      label: Subject area
      placeholder: Power Platform, Azure, integrations, security
    validations:
      required: true
  - type: textarea
    id: need
    attributes:
      label: What should be improved?
      description: Explain the audience, problem, and desired outcome.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context and references
      description: Add related documentation, examples, decisions, or known constraints.